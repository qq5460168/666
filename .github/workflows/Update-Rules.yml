name: Update Rules

on:
  # 手动触发
  workflow_dispatch:
  
  # 定时任务，每12小时一次
  schedule:
    - cron: '0 */12 * * *'
  
  # 检测到配置文件变动自动触发
  push:
    paths:
      - '.github/workflows/Update-Rules.yml'
      - 'data/**'       # 仅监控data目录下所有文件变动

# 同一时刻只允许一个更新任务运行，避免多个运行并发提交、互相抢占 master 导致 push rejected
# cancel-in-progress: false 表示新任务排队等待，而非取消正在进行的任务
concurrency:
  group: update-rules
  cancel-in-progress: false

jobs:
  update-rules:
    runs-on: ubuntu-latest

    steps:
      # 拉取仓库最新代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有历史记录，便于后续操作

      # 更新广告过滤规则
      - name: Update Rules
        continue-on-error: true
        run: |
          # 确保脚本有执行权限
          chmod +x ./data/script/*.sh 2>/dev/null || true
          
          # 如果存在更新脚本则执行
          if [ -f "./data/script/update-rules.sh" ]; then
            bash ./data/script/update-rules.sh
          else
            echo "未找到更新脚本: ./data/script/update-rules.sh"
          fi
          
          # 如果存在Python脚本则执行
          if [ -f "./data/script/update_rules.py" ]; then
            python3 ./data/script/update_rules.py
          fi

      # 更新并整理 ReadMe
      - name: Update ReadMe
        run: |
          # 如果存在README清理脚本则执行
          if [ -f "./data/script/clean-readme.sh" ]; then
            bash ./data/script/clean-readme.sh
          else
            echo "未找到README清理脚本: ./data/script/clean-readme.sh"
          fi

      # 提交并推送更改到仓库
      - name: Commit and push changes
        run: |
          # 配置Git用户信息
          git config --global user.name "AutoUpdater[Bot]"
          git config --global user.email "916899380+autoupdater[bot]@users.noreply.github.com"

          # 提交前先同步远程最新，避免 checkout 之后远程已前进导致 push rejected
          git fetch origin "${{ github.ref_name }}" || true

          # 添加所有更改
          git add --all

          # 检查是否有更改需要提交
          if git diff-index --quiet HEAD --; then
            echo "没有检测到更改，无需提交"
            exit 0
          fi

          # 提交更改
          git commit -m "自动更新: $(TZ=UTC-8 date +'%Y-%m-%d %H:%M:%S')（北京时间）"

          # 推送：若因并发被拒(fetch first)，则变基到最新后重试，最多3次
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref }}"; then
              echo "推送成功"
              exit 0
            fi
            echo "第 ${attempt} 次推送被拒，拉取远程最新并变基后重试..."
            git fetch origin "${{ github.ref_name }}"
            if git rebase "origin/${{ github.ref_name }}"; then
              echo "变基完成，准备再次推送"
            else
              # 生成物冲突时放弃本次提交（由下一次运行在最新基线上重新生成）
              echo "变基冲突，放弃本次提交，等待下次运行重新生成"
              git rebase --abort
              exit 0
            fi
          done

          echo "多次重试后仍推送失败，请人工检查"
          exit 1

      # 清理旧的 workflow 运行记录，节省空间
      - name: Cleanup old workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 5  # 保留最近的5次运行记录
